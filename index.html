<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100 select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seismokavach</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
       <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover, .glass-card.active {
            border-color: rgba(56, 189, 248, 0.8);
            background: rgba(30, 41, 59, 0.95);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.6), 0 0 20px rgba(56, 189, 248, 0.25);
        }

        /* SVG Dynamic Callout Overlay */
        #callout-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        /* Toast Animation */
        @keyframes slideIn {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast-animate { animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>

<body class="flex flex-col h-screen w-screen bg-slate-950 text-slate-100 overflow-hidden select-none">

    <!-- TOP HEADER & NAVIGATION BAR -->
    <header class="h-16 border-b border-slate-800/80 bg-slate-900/90 backdrop-blur-md px-5 flex items-center justify-between z-30 shrink-0">
        <!-- Brand Title & Integrity Status -->
        <div class="flex items-center space-x-4">
            <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-rose-700 to-amber-600 flex items-center justify-center shadow-lg shadow-rose-900/30 border border-rose-500/30">
                <i class="fa-solid fa-building-user text-white text-lg"></i>
            </div>
            <div>
                <div class="flex items-center space-x-2.5">
                    <h1 class="font-bold text-sm md:text-base tracking-wide text-white">KIT BOYS HOSTEL <span class="text-xs font-normal text-rose-400 font-mono">BIM v4.5</span></h1>
                    <span class="px-2 py-0.5 text-[10px] font-mono font-semibold bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-full flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-rose-500 animate-ping"></span>
                        <span id="header-anomaly-badge">5 Anomalies Detected</span>
                    </span>
                </div>
                <div class="flex items-center space-x-3 text-xs text-slate-400 mt-0.5">
                    <span class="flex items-center gap-1 text-emerald-400 font-mono">
                        <i class="fa-solid fa-shield-halved text-xs"></i> Integrity Index: <strong id="header-health-idx" class="text-emerald-300">84%</strong>
                    </span>
                    <span class="text-slate-600">•</span>
                    <span class="font-mono text-cyan-300">3-Story L-Block Structure</span>
                </div>
            </div>
        </div>
        <div class="flex items-center space-x-2.5">
            <button onclick="runAIAgentScan()" class="px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white text-xs font-medium flex items-center space-x-2 shadow-lg shadow-cyan-950/50 transition border border-cyan-400/30">
                <i class="fa-solid fa-brain text-cyan-200"></i>
                <span>Run AI Agent Scan</span>
            </button>
            <button onclick="broadcastToAllSelected()" class="px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-xs font-medium flex items-center space-x-2 shadow-lg shadow-emerald-950/50 transition border border-emerald-400/30">
                <i class="fa-solid fa-paper-plane text-emerald-200"></i>
                <span>Dispatch All Alerts</span>
            </button>
            <button onclick="resetCameraView()" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium transition border border-slate-700 flex items-center gap-1.5">
                <i class="fa-solid fa-rotate-left"></i>
                <span class="hidden md:inline">Reset Camera</span>
            </button>
        </div>
    </header>
    <!-- MAIN DASHBOARD CONTENT AREA -->
    <div class="relative flex-1 flex flex-col md:flex-row overflow-hidden">

        <!-- LEFT SIDEBAR: AUTHORITIES & BIM CONTROL PANEL -->
        <aside class="w-full md:w-80 glass-panel border-r border-slate-800/80 flex flex-col z-30 shrink-0 overflow-y-auto max-h-[calc(100vh-4rem)]">
            
            <!-- 1. AUTHORITIES & EMERGENCY RECIPIENTS PANEL -->
            <div class="p-4 border-b border-slate-800 bg-slate-900/40">
                <div class="flex items-center justify-between mb-2.5">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-user-shield text-cyan-400 text-xs"></i>
                        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-200">Hostel Authorities</h2>
                    </div>
                    <span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 font-mono">SMS / WhatsApp</span>
                </div>

                <p class="text-[11px] text-slate-400 mb-3 leading-relaxed">
                    Select recipients to dispatch instant structural risk breakdown alerts to their mobile phones.
                </p>
                <!-- Authority Recipient Cards -->
                <div class="space-y-2.5" id="authorities-container">
                    <!-- Populated dynamically via JS -->
                </div>

                <!-- Mass Broadcast Trigger -->
                <div class="mt-3 pt-3 border-t border-slate-800/80 flex items-center justify-between gap-2">
                    <label class="flex items-center gap-2 text-xs text-slate-400 cursor-pointer">
                        <input type="checkbox" id="select-all-authorities" checked onchange="toggleSelectAllAuthorities(this)" class="rounded border-slate-700 bg-slate-900 text-cyan-500 focus:ring-0">
                        Select All
                    </label>
                    <button onclick="broadcastToAllSelected()" class="px-2.5 py-1.5 rounded-lg bg-cyan-600/20 hover:bg-cyan-600/30 text-cyan-400 border border-cyan-500/30 text-[11px] font-semibold transition flex items-center gap-1.5">
                        <i class="fa-brands fa-whatsapp"></i> Broadcast Selected
                    </button>
                </div>
            </div>
            <!-- 2. RENDER VIEW MODES -->
            <div class="p-4 border-b border-slate-800">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">3D Rendering Mode</h2>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="setRenderMode('solid')" id="btn-mode-solid" class="mode-btn px-3 py-2 rounded-lg bg-blue-600 text-white text-xs font-medium border border-blue-500 transition text-left flex items-center gap-2 shadow-sm">
                        <i class="fa-solid fa-building text-xs"></i> Brick & Concrete
                    </button>
                    <button onclick="setRenderMode('xray')" id="btn-mode-xray" class="mode-btn px-3 py-2 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs font-medium border border-slate-700 transition text-left flex items-center gap-2">
                        <i class="fa-solid fa-eye text-xs"></i> X-Ray View
                    </button>
                    <button onclick="setRenderMode('wireframe')" id="btn-mode-wireframe" class="mode-btn px-3 py-2 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs font-medium border border-slate-700 transition text-left flex items-center gap-2">
                        <i class="fa-solid fa-border-all text-xs"></i> Structural Mesh
                    </button>
                    <button onclick="setRenderMode('heatmap')" id="btn-mode-heatmap" class="mode-btn px-3 py-2 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs font-medium border border-slate-700 transition text-left flex items-center gap-2">
                        <i class="fa-solid fa-fire text-xs"></i> Stress Heatmap
                    </button>
                </div>
            </div
